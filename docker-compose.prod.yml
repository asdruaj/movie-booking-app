services:
  postgres:
    image: postgres:16-alpine
    container_name: prod_postgres_ticketrush
    environment:
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=ticketrush_dev
    ports:
      - 5434:5432
    volumes:
      - prod_ticketrush_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prod_redis_ticketrush
    ports:
      - 6381:6379
    volumes:
      - prod_ticketrush_redisdata:/data

  server1:
    build: ./server
    container_name: prod_server1_ticketrush
    ports:
      - "5003:3000"
    environment:
      DATABASE_URL: postgres://postgres:devpassword@postgres:5432/ticketrush_dev
      REDIS_URL: redis://redis:6379
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL}
      INSTANCE_ID: server1
    depends_on:
      - postgres
      - redis
  server2:
    build: ./server
    container_name: prod_server2_ticketrush
    ports:
      - "5004:3000"
    environment:
      DATABASE_URL: postgres://postgres:devpassword@postgres:5432/ticketrush_dev
      REDIS_URL: redis://redis:6379
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL}
      INSTANCE_ID: server2
    depends_on:
      - postgres
      - redis
      
  nginx:
    image: nginx:alpine
    container_name: prod_nginx_ticketrush
    ports:
      - 8081:80
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - server1
      - server2

  client:
    container_name: prod_client_ticketrush
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - 5175:80
    depends_on:
      - nginx

volumes:
  prod_ticketrush_pgdata:
  prod_ticketrush_redisdata:
