services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_ticketrush
    environment:
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=ticketrush_dev
    ports:
      - 5432:5432
    volumes:
      - ticketrush_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_ticketrush
    ports:
      - 6379:6379
    volumes:
      - ticketrush_redisdata:/data

volumes:
  ticketrush_pgdata:
  ticketrush_pgdata_shard1:
  ticketrush_redisdata: