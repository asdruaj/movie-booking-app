name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ticketrush
            git pull origin main
            VITE_API_URL=http://${{ secrets.DEPLOY_HOST }}:8081/api/v1 CLIENT_URL=http://${{ secrets.DEPLOY_HOST }} docker compose -p ticketrush-prod -f docker-compose.prod.yml up -d --build